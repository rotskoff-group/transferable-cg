nn_model_name: MACE
nn_model_args:
  nn_cutoff: 20.0
  num_bessel: 8
  num_polynomial_cutoff: 5
  max_ell: 3
  num_interactions: 2
  hidden_irreps: 32x0e + 32x1o
  MLP_irreps: 16x0e
  correlation: 3
  max_z: null
  use_cueq: true
prior_model_name: ForceField
prior_model_args:
  nn_cutoff: 20.0
  return_forces: false
  has_bonded: true
  has_angles: true
  has_vdw: true
  has_wca: true
  has_coulomb: true
  has_dihedrals: true
  init_bonded_terms: true
  init_angle_terms: true
  init_dihedral_terms: true
  init_nonbonded_terms: true
  num_dihedral_basis: 10
  dielectric_constant: 1.0
  vdw_cutoff_distance: 20.0
return_forces: false
model_temperature: 300
loss_type: force matching
div_method: stein
div_samples: 1
div_epsilon: 0.0001
vectorize_div: false
l1_lambda: 1.0
load_balance_lambda: 0.0
layers_to_freeze:
- prior.bonds_mean
- prior.bonds_k
- prior.angles_mean
- prior.angles_k
- prior.dihedral_a1
- prior.dihedral_a2
optimizer: Adam
optimizer_args:
  nn_lr: 0.001
  prior_lr: 0.001
lr_scheduler: ReduceLROnPlateau
lr_scheduler_args:
  patience: 5
monitor: val/TotalLoss
sync_dist: true
on_step: false
